<!DOCTYPE >
< lang="tr">
<head>
<meta charset="UTF-8">
<title>Siyah Temalı Modern Hesap Makinesi</title>
<style>
  body{margin:0;padding:0;background:#1e1e1e;font-family:'Segoe UI',sans-serif;color:#f0f0f0;}
  #calculator{max-width:320px;margin:50px auto;background:#2d2d2d;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.5);overflow:hidden;}
  #display{background:#000;color:#0f0;font-size:2rem;text-align:right;padding:20px;box-sizing:border-box;}
  .buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
  button{padding:20px;font-size:1.2rem;background:#3c3c3c;border:none;color:#fff;border-radius:5px;cursor:pointer;}
  button.operator{background:#ff9500;}
  button:active{background:#555;}
</style>
</head>
<body>
<div id="calculator">
  <div id="display">0</div>
  <div class="buttons">
    <button class="operator" data-action="clear">C</button>
    <button class="operator" data-action="del">⌫</button>
    <button class="operator" data-action="%">%</button>
    <button class="operator" data-action="/">÷</button>

    <button data-value="7">7</button>
    <button data-value="8">8</button>
    <button data-value="9">9</button>
    <button class="operator" data-action="*">×</button>

    <button data-value="4">4</button>
    <button data-value="5">5</button>
    <button data-value="6">6</button>
    <button class="operator" data-action="-">-</button>

    <button data-value="1">1</button>
    <button data-value="2">2</button>
    <button data-value="3">3</button>
    <button class="operator" data-action="+">+</button>

    <button data-value="0" style="grid-column:span 2;">0</button>
    <button data-value=".">.</button>
    <button class="operator" data-action="=">=</button>
  </div>
</div>
<script>
const display=document.getElementById('display');
let expression='';
function updateDisplay(val){display.textContent=val||'0';}
document.querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const action=btn.dataset.action;
    const value=btn.dataset.value;
    if(action){
      if(action==='clear'){expression='';updateDisplay();}
      else if(action==='del'){expression=expression.slice(0,-1);updateDisplay(expression||'0');}
      else if(action==='='){try{expression=eval(expression).toString();updateDisplay(expression);}catch{updateDisplay('Error');expression='';}}
      else if(action==='%' ){expression+=value?value:'';updateDisplay(expression);}
      else{expression+=action;updateDisplay(expression);}
    }else{
      expression+=value;updateDisplay(expression);
    }
  });
});
</script>
</body>
</>
