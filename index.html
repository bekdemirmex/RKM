<!DOCTYPE >
< lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Todo List</title>
<style>
  body{
    background:#111;
    color:#0f0;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
  }
  #app{
    width:90%;
    max-width:400px;
    text-align:center;
  }
  h1{
    font-size:2rem;
    margin-bottom:1rem;
    text-shadow:0 0 10px #0f0;
  }
  input{
    width:70%;
    padding:10px;
    border:none;
    outline:none;
    background:#222;
    color:#0f0;
    border-radius:5px;
    font-size:1rem;
    transition:all .3s;
  }
  input:focus{
    border:1px solid #0f0;
    background:#111;
  }
  button{
    padding:10px 15px;
    margin-left:5px;
    border:none;
    background:#0f0;
    color:#111;
    font-weight:bold;
    cursor:pointer;
    border-radius:5px;
    transition:background .3s;
  }
  button:hover{
    background:#09f;
  }
  ul{
    list-style:none;
    padding:0;
    margin-top:1rem;
    text-align:left;
  }
  li{
    background:#222;
    margin:5px 0;
    padding:10px;
    border-radius:5px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    opacity:0;
    transform:translateX(-20px);
    animation:fadeIn 0.3s forwards;
    box-shadow:0 0 10px #0f0;
  }
  li.done{
    text-decoration:line-through;
    opacity:0.6;
  }
  .del{
    background:#f00;
    color:#fff;
    border:none;
    border-radius:3px;
    padding:2px 5px;
    cursor:pointer;
  }
  @keyframes fadeIn{
    to{opacity:1;transform:translateX(0);}
  }
</style>
</head>
<body>
<div id="app">
  <h1>Neon Todo</h1>
  <div>
    <input type="text" id="newTask" placeholder="Yeni görev ekle...">
    <button id="addBtn">+</button>
  </div>
  <ul id="list"></ul>
</div>
<script>
  const storageKey='neonTodo';
  const listEl=document.getElementById('list');
  const inputEl=document.getElementById('newTask');
  const addBtn=document.getElementById('addBtn');

  function loadTasks(){
    const data=localStorage.getItem(storageKey);
    return data?JSON.parse(data):[];
  }

  function saveTasks(tasks){
    localStorage.setItem(storageKey,JSON.stringify(tasks));
  }

  function render(){
    const tasks=loadTasks();
    listEl.innerHTML='';
    tasks.forEach((t,i)=>{
      const li=document.createElement('li');
      li.textContent=t.text;
      li.className=t.done?'done':'';
      const delBtn=document.createElement('button');
      delBtn.textContent='×';
      delBtn.className='del';
      delBtn.onclick=()=>removeTask(i);
      li.appendChild(delBtn);
      li.onclick=()=>toggleDone(i);
      listEl.appendChild(li);
    });
  }

  function addTask(){
    const txt=inputEl.value.trim();
    if(!txt)return;
    const tasks=loadTasks();
    tasks.push({text:txt,done:false});
    saveTasks(tasks);
    inputEl.value='';
    render();
  }

  function removeTask(index){
    const tasks=loadTasks();
    tasks.splice(index,1);
    saveTasks(tasks);
    render();
  }

  function toggleDone(index){
    const tasks=loadTasks();
    tasks[index].done=!tasks[index].done;
    saveTasks(tasks);
    render();
  }

  addBtn.onclick=addTask;
  inputEl.addEventListener('keypress',e=>e.key==='Enter'?addTask():null);
  render();
</script>
</body>
</>
