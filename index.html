<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Avrupa Futbol Analiz Dashboard</title>
<style>
:root{
  --bg:#0a0c10;
  --card:#1a1c22;
  --text:#e0e0e0;
  --accent:#28a745;
  --red:#dc3545;
  --border:#2c2e35;
  --warning:#ffc107;
}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;}
header{background:var(--border);padding:10px 20px;text-align:center;font-size:1.1rem;}
header .warning{background:var(--warning);color:#000;padding:5px 10px;border-radius:4px;}
main{flex:1;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;}
.card{background:var(--card);padding:15px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.5);}
.card h3{margin:0 0 10px 0;font-size:1.2rem;}
.card .time{font-size:0.9rem;color:#bbb;}
.card .teams{margin:10px 0;font-size:1.1rem;}
.card .form{margin:5px 0;font-size:0.9rem;}
.card .stat{margin:10px 0;font-size:0.9rem;}
.card .percent{display:flex;gap:5px;margin-top:5px;}
.bar{height:8px;border-radius:4px;flex:1;}
.bar.win{background:var(--accent);}
.bar.draw{background:var(--warning);}
.bar.lose{background:var(--red);}
@media(max-width:480px){
  main{grid-template-columns:1fr;}
}
</style>
</head>

function getMexicoCityTomorrow(){
  const nowUtc = new Date();
  const tz = 'America/Mexico_City';
  const options = {timeZone:tz, year:'numeric', month:'long', day:'numeric', weekday:'long'};
  const formatter = new Intl.DateTimeFormat('tr-TR',options);
  const tomorrow = new Date(nowUtc.getTime() + 24*60*60*1000);
  return formatter.format(tomorrow);
}
