<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Yarınki Avrupa Futbol Analizleri</title>
<style>
    :root{
        --bg:#0a0c10;
        --card:#1c1e28;
        --text:#e0e0e0;
        --accent:#00c853;
        --accent2:#ff1744;
        --accent3:#ffeb3b;
    }
    body{
        margin:0;
        font-family:Arial,Helvetica,sans-serif;
        background:var(--bg);
        color:var(--text);
        line-height:1.6;
    }
    #alert{
        background:var(--accent2);
        color:#fff;
        padding:10px 20px;
        text-align:center;
        font-weight:bold;
    }
    #header{
        padding:20px;
        text-align:center;
        font-size:1.2rem;
    }
    #matches{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
        gap:20px;
        padding:20px;
    }
    .card{
        background:var(--card);
        border-radius:8px;
        padding:15px;
        display:flex;
        flex-direction:column;
        justify-content:space-between;
    }
    .card h3{
        margin:0 0 5px 0;
        font-size:1.1rem;
    }
    .time{
        font-size:0.9rem;
        color:var(--accent3);
        margin-bottom:10px;
    }
    .teams{
        font-size:1rem;
        margin-bottom:10px;
    }
    .form{
        margin-bottom:10px;
        font-size:0.9rem;
    }
    .stats{
        display:flex;
        justify-content:space-between;
        margin-bottom:10px;
    }
    .stat{
        flex:1;
        text-align:center;
    }
    .bar{
        height:8px;
        border-radius:4px;
        margin-top:4px;
    }
    .bar.home{background:var(--accent);}
    .bar.draw{background:var(--accent3);}
    .bar.away{background:var(--accent2);}
    @media(max-width:480px){
        .teams{font-size:0.95rem;}
        .form{font-size:0.85rem;}
    }
</style>
</head>

<div id="alert">Eğitim / eğlence amaçlı istatistiksel analizdir, bahis tavsiyesi değildir.</div>
<div id="header"></div>
