<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Queretaro Emlak | Diplomacia.com.tr Tarzında</title>
<style>
:root{
  --primary:#004080;
  --primary-light:#0066cc;
  --bg:#f8f9fa;
  --text:#212529;
  --card-bg:#fff;
  --card-shadow:rgba(0,0,0,0.1);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
header{background:var(--primary);color:#fff;padding:1rem 2rem;}
header h1{font-size:1.5rem;margin-bottom:.5rem;}
.search-filter{display:flex;flex-wrap:wrap;gap:1rem;}
.search-filter label{display:flex;flex-direction:column;font-size:.9rem;}
.search-filter input, .search-filter select{padding:.5rem;border:1px solid #ccc;border-radius:4px;}
main{padding:2rem;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem;}
.card{background:var(--card-bg);border-radius:8px;overflow:hidden;box-shadow:0 2px 5px var(--card-shadow);transition:transform .2s;}
.card:hover{transform:translateY(-5px);}
.card img{width:100%;height:180px;object-fit:cover;}
.card-body{padding:1rem;}
.card-title{font-size:1.1rem;margin-bottom:.5rem;}
.card-location{font-size:.9rem;color:gray;margin-bottom:.5rem;}
.card-price{font-size:1rem;color:var(--primary);font-weight:bold;}
footer{background:var(--primary);color:#fff;padding:2rem;}
footer h2{font-size:1.5rem;margin-bottom:1rem;}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;}
form input, form textarea{padding:.75rem;border:none;border-radius:4px;}
form textarea{resize:none;height:120px;}
form button{grid-column:1/-1;background:var(--primary-light);color:#fff;padding:.75rem;border:none;border-radius:4px;cursor:pointer;font-size:1rem;}
@media(max-width:600px){
  header{flex-direction:column;align-items:flex-start;}
  .search-filter{flex-direction:column;}
  form{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<header>

  <div class="search-filter">

      <select id="cityFilter">

        <option value="puebla">Puebla</option>
        <option value="guadalajara">Guadalajara</option>
      </select>
    </label>
    <label>
      Fiyat Aralığı
      <input type="range" id="priceFilter" min="50000" max="500000" step="5000" value="500000">
    </label>
    <label id="priceLabel" style="font-weight:bold;">500.000 ₺ Üzeri</label>
  </div>
</header>

<main>
  <div class="cards" id="cardsContainer">
    <div class="card" data-city="queretaro" data-price="150000">
      <img src="https://images.unsplash.com/photo-1556901064-5d6b2b2b9b1d?auto=format&fit=crop&w=400&q=80" alt="İlan 1">
      <div class="card-body">
        <div class="card-title">Şehir Merkezi Konut</div>
        <div class="card-location">Queretaro, Merkez</div>
        <div class="card-price">150.000 ₺</div>
      </div>
    </div>
    <div class="card" data-city="queretaro" data-price="300000">
      <img src="https://images.unsplash.com/photo-1580587771525-78e3f4e9c6a4?auto=format&fit=crop&w=400&q=80" alt="İlan 2">
      <div class="card-body">
        <div class="card-title">Lüks Daire</div>
        <div class="card-location">Queretaro, San Juan</div>
        <div class="card-price">300.000 ₺</div>
      </div>
    </div>
    <div class="card" data-city="puebla" data-price="80000">
      <img src="https://images.unsplash.com/photo-1542314831-068a1d4b3e9b?auto=format&fit=crop&w=400&q=80" alt="İlan 3">
      <div class="card-body">
        <div class="card-title">Rahat Ev</div>
        <div class="card-location">Puebla, Centro</div>
        <div class="card-price">80.000 ₺</div>
      </div>

    <div class="card" data-city="guadalajara" data-price="450000">
      <img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=400&q=80" alt="İlan 4">
      <div class="card-body">
        <div class="card-title">Modern Villa</div>
        <div class="card-location">Guadalajara, Zapopan</div>
        <div class="card-price">450.000 ₺</div>
      </div>
    </div>
    <div class="card" data-city="queretaro" data-price="120000">
      <img src="https://images.unsplash.com/photo-1556912167-5f3d4d2e6b1a?auto=format&fit=crop&w=400&q=80" alt="İlan 5">
      <div class="card-body">
        <div class="card-title">Konut</div>
        <div class="card-location">Queretaro, Ixtlahuaca</div>
        <div class="card-price">120.000 ₺</div>
      </div>
    </div>
    <div class="card" data-city="puebla" data-price="250000">
      <img src="https://images.unsplash.com/photo-1525298594281-7e2c4c6c6f5b?auto=format&fit=crop&w=400&q=80" alt="İlan 6">
      <div class="card-body">
        <div class="card-title">Kampüs Yakınlığı</div>
        <div class="card-location">Puebla, San Juan</div>
        <div class="card-price">250.000 ₺</div>
      </div>
    </div>
  </div>
</main>

<footer>
  <h2>İletişim</h2>
  <form id="contactForm">
    <input type="text" id="name" placeholder="Adınız" required>
    <input type="email" id="email" placeholder="E-posta" required>
    <textarea id="message" placeholder="Mesajınız" required></textarea>
    <button type="submit">Gönder</button>
  </form>
</footer>
