<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Todo</title>
<style>
body{margin:0;min-height:100vh;background:#0a0a0a;color:#fff;font-family:system-ui;display:flex;justify-content:center;padding-top:80px}
.app{width:90%;max-width:420px}
h1{text-align:center;color:#39ff14;text-shadow:0 0 10px #39ff14,0 0 20px #39ff14;font-size:32px}
.add{display:flex;gap:8px;margin:20px 0}
input{flex:1;background:#1a1a1a;border:1px solid #39ff14;color:#fff;padding:12px;border-radius:8px;outline:none}
.add button{background:#39ff14;border:0;width:42px;border-radius:8px;font-weight:bold;cursor:pointer;box-shadow:0 0 10px #39ff14}
ul{list-style:none;padding:0}
li{background:#151515;border:1px solid #222;padding:12px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
li.done{opacity:.5;text-decoration:line-through}
li button{background:transparent;border:0;color:#ff4444;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<h1>Neon Todo</h1>
<div class="add"><input id="inp" placeholder="Yeni görev ekle..."><button onclick="ekle()">+</button></div>
<ul id="list"></ul>
</div>
<script>
let todos=JSON.parse(localStorage.getItem('todos')||'[]');
let list=document.getElementById('list'), inp=document.getElementById('inp');
function render(){
 list.innerHTML='';
 todos.forEach((t,i)=>{
  let li=document.createElement('li');
  if(t.done) li.className='done';
  li.innerHTML=`<span onclick="toggle(${i})">${t.text}</span><button onclick="sil(${i})">×</button>`;
  list.appendChild(li);
 });
 localStorage.setItem('todos',JSON.stringify(todos));
}
function ekle(){
 if(!inp.value.trim()) return;
 todos.push({text:inp.value,done:false});
 inp.value=''; render();
}
function toggle(i){todos[i].done=!todos[i].done; render()}
function sil(i){todos.splice(i,1); render()}
inp.addEventListener('keydown',e=>{if(e.key==='Enter') ekle()});
render();
</script>
</body>
</html>
