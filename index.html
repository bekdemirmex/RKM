<!DOCTYPE >
< lang="tr">
<head>
<meta charset="UTF-8">
<title>Neon Cyberpunk TODO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:#111;color:#eee;}
  .header{text-align:center;padding:20px 0;}
  .header h1{font-size:2.5rem;color:#ff00ff;text-shadow:0 0 5px #ff00ff,0 0 10px #ff00ff,0 0 15px #ff00ff,0 0 20px #ff00ff,0 0 25px #ff00ff;}
  .container{max-width:600px;margin:auto;padding:10px;}
  .input-group{display:flex;margin-bottom:15px;}
  .input-group input{flex:1;padding:10px;font-size:1rem;border:2px solid #ff00ff;border-right:none;background:#222;color:#eee;}
  .input-group button{padding:10px 15px;border:none;background:#ff00ff;color:#111;font-size:1rem;cursor:pointer;}
  .input-group button:hover{background:#ff33ff;}
  .list{list-style:none;padding:0;}
  .list li{padding:10px;margin-bottom:5px;background:#222;border-radius:5px;display:flex;align-items:center;justify-content:space-between;transition:background .2s;color:#eee;}
  .list li:hover{background:#333;}
  .list li.completed{color:#555;text-decoration:line-through;}
  .list li button{background:none;border:none;color:#ff00ff;font-size:1.2rem;cursor:pointer;}
  .list li button:hover{color:#ff33ff;}
  .glow{box-shadow:0 0 10px #ff00ff;}
</style>
</head>
<body>
<div class="header"><h1>Neon Cyberpunk TODO</h1></div>
<div class="container">
  <div class="input-group">
    <input type="text" id="taskInput" placeholder="Yeni görev...">
    <button id="addBtn">Ekle</button>
  </div>
  <ul id="todoList" class="list"></ul>
</div>
<script>
  const listEl=document.getElementById('todoList');
  const input=document.getElementById('taskInput');
  const addBtn=document.getElementById('addBtn');
  function load(){const d=localStorage.getItem('tasks');if(d){JSON.parse(d).forEach(addTask);}}
  function save(){const t=[];listEl.querySelectorAll('li').forEach(li=>t.push({text:li.firstChild.textContent,completed:li.classList.contains('completed')}));localStorage.setItem('tasks',JSON.stringify(t));}
  function addTask(item){const li=document.createElement('li');li.classList.add('glow');const span=document.createElement('span');span.textContent=typeof item==='string'?item:item.text;if(item&&item.completed)li.classList.add('completed');const delBtn=document.createElement('button');delBtn.textContent='✖';delBtn.onclick=e=>{e.stopPropagation();li.remove();save();};li.appendChild(span);li.appendChild(delBtn);li.onclick=()=>{li.classList.toggle('completed');save();};listEl.appendChild(li);}
  addBtn.onclick=e=>{e.preventDefault();const txt=input.value.trim();if(txt){addTask(txt);input.value='';save();}}
  input.addEventListener('keyup',e=>{if(e.key==='Enter')addBtn.click();});
  load();
</script>
</body>
</>
