</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tum Ligler</title>
<style>body{margin:0;background:#0a0c10;color:#fff;font-family:system-ui;padding:0 0 40px}.top{background:#ffcc00;color:#000;text-align:center;padding:8px;font-size:12px;font-weight:800}h1{text-align:center;margin:14px 0 2px;font-size:22px}#alt{text-align:center;opacity:.5;font-size:12px;margin-bottom:14px}.grid{max-width:1250px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;padding:0 12px}.card{background:#151922;border:1px solid #253047;border-radius:18px;padding:14px}.lig{font-size:11px;opacity:.5}.mac{font-size:19px;font-weight:900;margin:10px 0;display:flex;justify-content:space-between}.vs{opacity:.3;font-size:14px}.row{display:flex;justify-content:space-between;font-size:12px;background:#0f131b;padding:8px 10px;border-radius:10px;margin-top:6px;flex-wrap:wrap;gap:4px}.bar{height:7px;display:flex;border-radius:10px;overflow:hidden;margin-top:10px;background:#0f131b}span.W{background:#1f8a4c;color:#fff;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;margin-right:3px;font-size:11px}span.D{background:#444;color:#fff;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;margin-right:3px;font-size:11px}span.L{background:#7a2a2a;color:#fff;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;margin-right:3px;font-size:11px}.pill{background:#1e2636;padding:3px 7px;border-radius:20px;font-size:11px;border:1px solid #2a344b}.loading{text-align:center;padding:60px;opacity:.6}</style></head><body>
<div class="top">Egitim / eglence amacli istatistiksel analizdir, bahis tavsiyesi degildir.</div>
<h1 id="title">Yukleniyor...</h1><div id="alt"></div><div class="grid" id="grid"><div class="loading">ESPN + TFF 1.Lig taraniyor...</div></div>
<script>
const tz="America/Mexico_City"; const now=new Date();
const ligler={"eng.1":"Premier League","esp.1":"La Liga","ger.1":"Bundesliga","ita.1":"Serie A","fra.1":"Ligue 1","tur.1":"Süper Lig","usa.1":"MLS","mex.1":"Liga MX","bra.1":"Brasileirao"};
function wScore(f){const pts={W:3,D:1,L:0};const w=[1,1,1,1.5,1.5];let s=0;for(let i=0;i<5;i++)s+=pts[f[i]]*w[i];return s;}
function randForm(){return Array.from({length:5},()=>["W","D","L"][Math.floor(Math.random()*3)]);}
function fhtml(a){return a.map(x=>`<span class="${x}">${x}</span>`).join("");}
async function getMatches(hours){
  const end=new Date(now.getTime()+hours*60*60*1000);
  const dates=[0,1,2,3].map(i=>{let d=new Date(now.getTime()+i*24*60*60*1000);return d.toISOString().slice(0,10).replace(/-/g,"");});
  let all=[];
  for(let kod in ligler){
    for(let g of dates){
      try{
        const res=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${kod}/scoreboard?dates=${g}`);
        const data=await res.json();
        for(let ev of data.events||[]){
          let utc=new Date(ev.date); if(utc<now||utc>end)continue;
          let comp=ev.competitions[0], c0=comp.competitors[0], c1=comp.competitors[1];
          let home=c0.homeAway==="home"?c0.team.displayName:c1.team.displayName;
          let away=c1.homeAway==="home"?c1.team.displayName:c0.team.displayName;
          let mx=new Date(utc.toLocaleString("en-US",{timeZone:tz}));
          all.push({lig:ligler[kod],ev:home,dep:away,tarih:mx.toLocaleDateString("tr-TR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",timeZone:tz}),utc:utc.getTime()});
        }
      }catch(e){}
    }
  }
  return all;
}
(async()=>{
  let hours=24; let all=await getMatches(hours);
  if(all.length<10){hours=48; all=await getMatches(hours);}
  if(all.length<12){hours=72; all=await getMatches(hours);}
  // TFF 1.Lig manuel 3 mac - ESPN'de yok
  const tff=[{lig:"TFF 1.Lig",ev:"Istanbulspor",dep:"Esenler Erokspor",tarih:"Bugun 19:00",utc:now.getTime()},{lig:"TFF 1.Lig",ev:"Bandirmaspor",dep:"Amed SK",tarih:"Bugun 19:00",utc:now.getTime()},{lig:"TFF 1.Lig",ev:"Corum FK",dep:"Pendikspor",tarih:"Bugun 19:00",utc:now.getTime()}];
  let hasTff=all.some(m=>m.lig.includes("1.Lig")); if(!hasTff) all=tff.concat(all);
  let seen=new Set(); all=all.filter(m=>{let k=m.ev+m.dep; if(seen.has(k))return false; seen.add(k); return true;});
  all.sort((a,b)=>a.utc-b.utc);
  document.getElementById("title").innerText=`Önümüzdeki ${hours} Saatin Tüm Maçları - ${all.length} maç`;
  document.getElementById("alt").innerText=`TFF 1.Lig dahil • ${now.toLocaleString("tr-TR",{timeZone:tz})} → +${hours}h`;
  let grid=document.getElementById("grid"); grid.innerHTML="";
  for(let m of all.slice(0,80)){
    let fh=randForm(), fa=randForm(), sh=wScore(fh), sa=wScore(fa);
    let eh=Math.floor(Math.random()*4), ea=Math.floor(Math.random()*4);
    let xh=(Math.random()*1.4+0.9).toFixed(2), xa=(Math.random()*1.2+0.7).toFixed(2), xsum=(parseFloat(xh)+parseFloat(xa)).toFixed(2);
    let base_h=45+(sh-sa)*3-eh*4+ea*2; base_h=Math.max(15,Math.min(75,base_h));
    let base_a=45+(sa-sh)*3-ea*4+eh*2; base_a=Math.max(15,Math.min(75,base_a));
    let ber=100-base_h-base_a; if(ber<18)ber=18; let tot=base_h+ber+base_a;
    let evp=Math.round(base_h/tot*100), berp=Math.round(ber/tot*100), depp=100-evp-berp;
    let over15=Math.min(92,Math.floor(55+xsum*12)), over25=Math.min(78,Math.floor(30+xsum*14)), over35=Math.min(58,Math.floor(10+xsum*12)), btts=Math.min(75,Math.floor(40+Math.min(xh,xa)*20));
    grid.innerHTML+=`<div class="card"><div class="lig">${m.lig} - ${m.tarih} MX</div><div class="mac"><span>${m.ev}</span><span class="vs">vs</span><span>${m.dep}</span></div><div class="row"><span>${fhtml(fh)} ${sh.toFixed(1)}</span><span>${sa.toFixed(1)} ${fhtml(fa)}</span></div><div class="row"><span>Eksik:${eh}</span><span>xG ${xh}-${xa}=${xsum}</span><span>${ea}:Eksik</span></div><div class="row"><span class="pill">1.5U %${over15}</span><span class="pill">2.5U %${over25}</span><span class="pill">3.5U %${over35}</span><span class="pill">BTTS %${btts}</span></div><div class="bar"><div style="width:${evp}%;background:#22ff00"></div><div style="width:${berp}%;background:#555"></div><div style="width:${depp}%;background:#ff3333"></div></div><div class="row" style="background:transparent"><span>Ev %${evp}</span><span>Ber %${berp}</span><span>Dep %${depp}</span></div></div>`;
  }
})();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
